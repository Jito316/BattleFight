<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111418; }
      /* ウィンドウいっぱいに表示する(固定サイズを引き伸ばさない) */
      #unity-canvas { display: block; width: 100%; height: 100%; background: #111418; outline: none; }
      #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
                 color: #c8d0dc; font-family: "Hiragino Sans", "Yu Gothic UI", sans-serif; text-align: center; }
      #bar { width: 320px; height: 8px; margin-top: 14px; background: #2a2f38; border-radius: 4px; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #4aa8ff; }
      #error { display: none; position: absolute; left: 0; right: 0; top: 0; z-index: 10; max-height: 50%; overflow: auto;
               padding: 10px 14px; background: rgba(150, 30, 30, 0.95); color: #fff;
               font: 13px/1.4 Consolas, monospace; white-space: pre-wrap; user-select: text; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">{{{ PRODUCT_NAME }}} を読み込み中…<div id="bar"><div id="fill"></div></div></div>
    <div id="error"></div>
    <script>
      const canvas = document.querySelector("#unity-canvas");

      // エラーはアラートではなく画面上部に全文を出す(コピーして報告できるように)
      function showError(message) {
        const panel = document.querySelector("#error");
        panel.style.display = "block";
        panel.textContent += message + "\n";
      }

      const buildUrl = "Build";
      const config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // キャンバスの表示サイズに描画解像度を合わせる。高解像度ディスプレイは 1.5 倍まで(2 倍だと 4K 相当になり重い)
        matchWebGLToCanvasSize: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
        showBanner: (message, type) => {
          if (type === "error") showError(message);
          else console.warn(message);
        },
      };

      window.addEventListener("error", (e) => showError(String(e.message || e)));
      window.addEventListener("unhandledrejection", (e) => {
        const reason = String(e.reason && (e.reason.stack || e.reason.message) || e.reason);
        // ポインターロックの拒否はゲームには影響しないので出さない
        if (!/pointer lock/i.test(reason)) showError(reason);
      });

      const script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then((instance) => {
          // 遊んで確かめる用(コンソールから unityInstance.SendMessage を呼べるように)
          window.unityInstance = instance;
          document.querySelector("#loading").remove();
          canvas.focus();
        }).catch((message) => showError(String(message)));
      };
      document.body.appendChild(script);
      canvas.addEventListener("pointerdown", () => canvas.focus());

      // Tab(ロックオン)でブラウザがフォーカスを移さないようにする
      canvas.addEventListener("keydown", (e) => { if (e.code === "Tab") e.preventDefault(); });

      // 押していたキーを離したことが Unity に届かないと、移動しっぱなしになる。
      // 届かないことがある場面で、押したままのキーの keyup を送って離したことにする:
      // フォーカスが外れた・タブを隠した・右クリックのメニュー・ポインターロックや全画面の切り替え・
      // 日本語入力(IME)が始まった・Mac の Cmd を離した(Cmd を押している間は、ほかのキーの keyup が来ない)。
      // Unity はページ全体のキーを読むので、キャンバス以外にフォーカスがあるときも数える(window の capture)。
      const heldKeys = new Map();
      function sendKeyUp(code, key, keyCode) {
        const up = new KeyboardEvent("keyup", { code, key, bubbles: true, cancelable: true });
        // 古い読み方(keyCode / which)で判定する処理にも届くようにする
        Object.defineProperty(up, "keyCode", { get: () => keyCode });
        Object.defineProperty(up, "which", { get: () => keyCode });
        sendingKeyUp = true;
        try { canvas.dispatchEvent(up); } finally { sendingKeyUp = false; }
      }
      let sendingKeyUp = false;
      function releaseHeldKeys() {
        const released = [...heldKeys];
        heldKeys.clear();
        for (const [code, { key, keyCode }] of released) sendKeyUp(code, key, keyCode);
      }
      window.addEventListener("keydown", (e) => {
        if (!e.code) return;
        // IME の入力中(keyCode 229 / "Process")は本当のキーがわからないので、前に覚えた値を残す
        if (e.keyCode === 229 || e.key === "Process") { if (!heldKeys.has(e.code)) heldKeys.set(e.code, { key: e.code, keyCode: 0 }); return; }
        heldKeys.set(e.code, { key: e.key, keyCode: e.keyCode });
      }, true);
      window.addEventListener("keyup", (e) => {
        if (sendingKeyUp || !e.code) return;
        const held = heldKeys.get(e.code);
        heldKeys.delete(e.code);
        // IME が keyup を横取りすると、Unity は離したキーがわからない。覚えた値で送り直す
        if ((e.keyCode === 229 || e.key === "Process") && held && held.keyCode) sendKeyUp(e.code, held.key, held.keyCode);
        if (e.key === "Meta" || e.key === "OS") releaseHeldKeys();
      }, true);
      canvas.addEventListener("blur", releaseHeldKeys);
      window.addEventListener("blur", releaseHeldKeys);
      window.addEventListener("contextmenu", releaseHeldKeys);
      window.addEventListener("compositionstart", releaseHeldKeys, true);
      // ポインターロックは、外れたときだけ(クリックでロックしたときに、押している移動キーを離さないように)
      document.addEventListener("pointerlockchange", () => { if (!document.pointerLockElement) releaseHeldKeys(); });
      document.addEventListener("fullscreenchange", releaseHeldKeys);
      document.addEventListener("visibilitychange", () => { if (document.hidden) releaseHeldKeys(); });
    </script>
  </body>
</html>
